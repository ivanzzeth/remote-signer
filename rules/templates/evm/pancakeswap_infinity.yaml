# PancakeSwap Infinity (evm_js) — Universal Router `execute`, validated to the leaf.
#
# WHY THIS EXISTS: uniswap.yaml whitelists `execute(bytes,bytes[],uint256)` and
# validates nothing inside it — its own comment says so ("V4 Universal Router
# methods are whitelisted but not deeply validated"). dex_swap_v3.yaml takes the
# opposite line and refuses the selector outright. Both are defensible for a
# router that is one venue among many; neither works when the Universal Router is
# the *only* way to reach a venue, because then "allowlist the address" is the
# entire rule and the guard is reduced to a single address comparison.
#
# On BSC, PancakeSwap Infinity pools live inside a singleton CLPoolManager that an
# EOA cannot call directly (it requires unlock + callback), so every Infinity swap
# is a Universal Router `execute`. That is the majority of BSC liquidity behind
# one waved-through selector.
#
# WHAT IT VALIDATES — the calldata is two layers:
#
#   execute(commands, inputs[], deadline)              <- layer 1
#      commands = 0x10                  INFI_SWAP        (native in: no permit needed)
#               | 0x0a10                PERMIT2_PERMIT then INFI_SWAP (token in)
#      inputs[swap] = abi.encode(actions, params[])    <- layer 2
#         actions = 0x06 SWAP_EXACT_IN_SINGLE
#                   0x0c SETTLE_ALL      pay the Vault
#                   0x0f TAKE_ALL        take the output
#
# SECURITY — where the output goes. TAKE_ALL (0x0f) credits `msg.sender`, so the
# recipient is the signer by construction and there is no address to check. TAKE
# (0x0e) takes a recipient argument. This template therefore pins the action
# sequence to exactly 0x060c0f: anything else is refused rather than inspected,
# because "some other action list" is precisely where a recipient could appear.
#
# SECURITY — the output floor. TAKE_ALL's second parameter is a *minimum*. Zero
# there accepts any output, including none, which is how a swap that is really a
# donation still looks like a swap. The floor must be non-zero.
#
# SECURITY — the pool. An Infinity pool is identified by a PoolKey, not an
# address, and `hooks` is a contract that can rewrite amounts. Only pools whose
# poolManager is in `allowed_pool_managers` and whose hooks are in
# `allowed_hooks` pass; the default for hooks is the zero address, i.e. no hook.
#
# NOTE: native currency inside Infinity is address(0), NOT the wrapped token, and
# there is no WRAP command. A buy carries its budget as the transaction's `value`.
name: PancakeSwap Infinity via Universal Router
variables:
  - name: universal_router_address
    type: address
    description: "Universal Router. PancakeSwap on BSC: 0xd9c500dff816a1da21a48a732d3498bf09dc9aeb"
    required: true
  - name: allowed_pool_managers
    type: address_list
    description: "CLPoolManager singletons whose pools may be traded. REQUIRED — this is what stops a swap against a pool manager nobody chose."
    required: true
  - name: allowed_hooks
    type: address_list
    description: "Permitted hook contracts. Default is the zero address only: a hook can rewrite swap amounts, so an unrestricted list removes the guarantee this template provides."
    required: false
    default: "0x0000000000000000000000000000000000000000"
  - name: allowed_tokens
    type: address_list
    description: "Tokens allowed on either side of the pool. Empty = any. address(0) is the chain's native coin."
    required: false
    default: ""
  - name: max_amount_in
    type: string
    description: "Max amountIn per swap, in the input token's smallest unit. -1 = no cap."
    required: false
    default: "-1"
  - name: permit2_address
    type: address
    description: "Permit2 used by the sell path. Only checked as the spender target; the grant itself is validated by the permit2_permit_single template, which sees a typed_data request this rule never does."
    required: false
    default: "0x31c2f6fcff4f8759b3bd5bf0e1084a055615c768"
test_variables:
  chain_id: "56"
  universal_router_address: "0xd9c500dff816a1da21a48a732d3498bf09dc9aeb"
  allowed_pool_managers: "0xa0ffb9c1ce1fe56963b0321b32e7a0302114058b"
  allowed_hooks: "0x0000000000000000000000000000000000000000"
  allowed_tokens: "0x0000000000000000000000000000000000000000,0x82ec31d69b3c289e541b50e30681fd1acad24444"
  max_amount_in: "1000000000000000000"
  permit2_address: "0x31c2f6fcff4f8759b3bd5bf0e1084a055615c768"
rules:
  - id: "pancakeswap-infinity"
    name: "PancakeSwap Infinity via Universal Router"
    type: "evm_js"
    mode: "whitelist"
    enabled: true
    description: "Universal Router execute() decoded to the swap params: command and action sequences pinned, pool manager and hooks allowlisted, amount capped, output floor non-zero"
    config:
      sign_type_filter: "transaction"
      script: |
        var CMD_INFI_SWAP = '0x10';
        var CMD_PERMIT_THEN_SWAP = '0x0a10';
        var ACTIONS_EXACT_IN = '0x060c0f';

        function validate(input) {
          var ctx = rs.tx.require(input);
          require(rs.addr.inList(ctx.tx.to, [config.universal_router_address]), 'wrong router');

          var executeSel = selector('execute(bytes,bytes[],uint256)');
          if (!eq(ctx.selector, executeSel)) revert('method not allowed');

          var outer = abi.decode(ctx.payloadHex, ['bytes', 'bytes[]', 'uint256']);
          require(outer && outer.length === 3, 'execute decode failed');
          var commands = lower(outer[0]);
          var inputs = outer[1];

          // Exactly the two shapes this system produces. Anything else is
          // refused rather than inspected: an unrecognised command list is where
          // a sweep, a transfer or a second recipient would live.
          var swapInput;
          if (commands === CMD_INFI_SWAP) {
            require(inputs.length === 1, 'one command, one input');
            swapInput = toHex(inputs[0]);
          } else if (commands === CMD_PERMIT_THEN_SWAP) {
            require(inputs.length === 2, 'two commands, two inputs');
            validatePermitCommand(toHex(inputs[0]));
            swapInput = toHex(inputs[1]);
          } else {
            revert('command sequence not allowed');
          }

          return validateSwapCommand(swapInput);
        }

        function validateSwapCommand(swapInput) {
          var inner = abi.decode(swapInput, ['bytes', 'bytes[]']);
          require(inner && inner.length === 2, 'swap input decode failed');

          // Pinned, not parsed. TAKE_ALL (0x0f) credits msg.sender and takes no
          // recipient; TAKE (0x0e) does. Accepting "some other action list" is
          // exactly how a recipient gets in.
          require(lower(inner[0]) === ACTIONS_EXACT_IN, 'action sequence not allowed');
          var params = inner[1];
          require(params.length === 3, 'three actions, three params');

          var swap = abi.decode(toHex(params[0]), [
            { type: 'tuple', components: [
              { name: 'poolKey', type: 'tuple', components: [
                { name: 'currency0', type: 'address' },
                { name: 'currency1', type: 'address' },
                { name: 'hooks', type: 'address' },
                { name: 'poolManager', type: 'address' },
                { name: 'fee', type: 'uint24' },
                { name: 'parameters', type: 'bytes32' }
              ]},
              { name: 'zeroForOne', type: 'bool' },
              { name: 'amountIn', type: 'uint128' },
              { name: 'amountOutMinimum', type: 'uint128' },
              { name: 'hookData', type: 'bytes' }
            ]}
          ]);
          require(swap && swap.length === 1, 'swap params decode failed');
          var s = swap[0];
          var key = s.poolKey;

          // Which singleton holds the pool, and whether anything may rewrite the
          // amounts on the way through.
          rs.addr.requireInList(key.poolManager, config.allowed_pool_managers, 'pool manager not allowed');
          rs.addr.requireInList(key.hooks, config.allowed_hooks, 'hook not allowed');
          rs.addr.requireInListIfNonEmpty(key.currency0, config.allowed_tokens, 'currency0 not allowed');
          rs.addr.requireInListIfNonEmpty(key.currency1, config.allowed_tokens, 'currency1 not allowed');

          rs.bigint.requireLte(s.amountIn, config.max_amount_in, 'amountIn exceeds cap');

          // A zero floor accepts any output, including none. Then a swap that is
          // really a donation is indistinguishable from one that worked.
          requireNonZero(s.amountOutMinimum, 'amountOutMinimum must be non-zero');

          // TAKE_ALL's second parameter is the same floor, declared again on the
          // settlement side. Zero here reopens what the line above just closed.
          var take = abi.decode(toHex(params[2]), ['address', 'uint256']);
          require(take && take.length === 2, 'take params decode failed');
          requireNonZero(take[1], 'TAKE_ALL floor must be non-zero');

          return ok();
        }

        function validatePermitCommand(permitInput) {
          var dec = abi.decode(permitInput, [
            { type: 'tuple', components: [
              { name: 'details', type: 'tuple', components: [
                { name: 'token', type: 'address' },
                { name: 'amount', type: 'uint160' },
                { name: 'expiration', type: 'uint48' },
                { name: 'nonce', type: 'uint48' }
              ]},
              { name: 'spender', type: 'address' },
              { name: 'sigDeadline', type: 'uint256' }
            ]},
            'bytes'
          ]);
          require(dec && dec.length === 2, 'permit decode failed');
          var p = dec[0];

          // The grant rides inside this transaction, so it is checked here too.
          // The signature over it was validated separately, as typed_data, by
          // the permit2_permit_single rule — a rule this one never sees, which
          // is why the amount is bounded in both places.
          rs.addr.requireInList(p.spender, [config.universal_router_address], 'permit spender must be the router');
          rs.addr.requireInListIfNonEmpty(p.details.token, config.allowed_tokens, 'permit token not allowed');
          rs.bigint.requireLte(p.details.amount, config.max_amount_in, 'permit amount exceeds cap');
        }

        function lower(h) {
          return String(h).toLowerCase();
        }

        // `bytes` comes back from abi.decode as a hex string, but an element of
        // a `bytes[]` comes back as an array of byte values. Measured, not
        // assumed: the buy's swap input arrives as 864 numbers.
        function toHex(b) {
          if (typeof b === 'string') return b;
          var s = '0x';
          for (var i = 0; i < b.length; i++) {
            var h = (b[i] & 0xff).toString(16);
            s += (h.length === 1 ? '0' + h : h);
          }
          return s;
        }

        // rs.bigint has requireLte but no requireGt. Values arrive as decimal
        // strings (big.Int.String()), which has no leading zeros, so comparing
        // against '0' is exact rather than a parse that could overflow.
        function requireNonZero(v, msg) {
          require(String(v) !== '0' && String(v) !== '', msg);
        }
    test_cases:
      - name: 'pass: a native-in Infinity buy, the exact three actions'
        input:
          sign_type: "transaction"
          chain_id: 56
          signer: "0xf39fd6e51aad88f6f4ce6ab8827279cfffb92266"
          transaction:
            from: "0xf39fd6e51aad88f6f4ce6ab8827279cfffb92266"
            to: "0xd9c500dff816a1da21a48a732d3498bf09dc9aeb"
            value: "1000000000000000000"
            data: ""
        expect_pass: true
      - name: 'pass: a sell — Permit2 grant and swap in one transaction'
        input:
          sign_type: "transaction"
          chain_id: 56
          signer: "0xf39fd6e51aad88f6f4ce6ab8827279cfffb92266"
          transaction:
            from: "0xf39fd6e51aad88f6f4ce6ab8827279cfffb92266"
            to: "0xd9c500dff816a1da21a48a732d3498bf09dc9aeb"
            value: "0"
            data: ""
        expect_pass: true
      - name: 'reject: wrong router'
        input:
          sign_type: "transaction"
          chain_id: 56
          signer: "0xf39fd6e51aad88f6f4ce6ab8827279cfffb92266"
          transaction:
            from: "0xf39fd6e51aad88f6f4ce6ab8827279cfffb92266"
            to: "0x000000000000000000000000000000000000dEaD"
            value: "1000000000000000000"
            data: ""
        expect_pass: false
        expect_reason: "wrong router"
      - name: 'reject: an unknown Universal Router command'
        input:
          sign_type: "transaction"
          chain_id: 56
          signer: "0xf39fd6e51aad88f6f4ce6ab8827279cfffb92266"
          transaction:
            from: "0xf39fd6e51aad88f6f4ce6ab8827279cfffb92266"
            to: "0xd9c500dff816a1da21a48a732d3498bf09dc9aeb"
            value: "1000000000000000000"
            data: ""
        expect_pass: false
        expect_reason: "command sequence not allowed"
      - name: 'reject: TAKE instead of TAKE_ALL — that one can name a recipient'
        input:
          sign_type: "transaction"
          chain_id: 56
          signer: "0xf39fd6e51aad88f6f4ce6ab8827279cfffb92266"
          transaction:
            from: "0xf39fd6e51aad88f6f4ce6ab8827279cfffb92266"
            to: "0xd9c500dff816a1da21a48a732d3498bf09dc9aeb"
            value: "1000000000000000000"
            data: ""
        expect_pass: false
        expect_reason: "action sequence not allowed"
      - name: 'reject: a method that is not execute()'
        input:
          sign_type: "transaction"
          chain_id: 56
          signer: "0xf39fd6e51aad88f6f4ce6ab8827279cfffb92266"
          transaction:
            from: "0xf39fd6e51aad88f6f4ce6ab8827279cfffb92266"
            to: "0xd9c500dff816a1da21a48a732d3498bf09dc9aeb"
            value: "0"
            data: "0x06fdde03"
        expect_pass: false
        expect_reason: "method not allowed"
      - name: 'reject: a pool inside a pool manager nobody chose'
        input:
          sign_type: "transaction"
          chain_id: 56
          signer: "0xf39fd6e51aad88f6f4ce6ab8827279cfffb92266"
          transaction:
            from: "0xf39fd6e51aad88f6f4ce6ab8827279cfffb92266"
            to: "0xd9c500dff816a1da21a48a732d3498bf09dc9aeb"
            value: "1000000000000000000"
            data: ""
        expect_pass: false
        expect_reason: "pool manager not allowed"
      - name: 'reject: a hook that could rewrite the amounts'
        input:
          sign_type: "transaction"
          chain_id: 56
          signer: "0xf39fd6e51aad88f6f4ce6ab8827279cfffb92266"
          transaction:
            from: "0xf39fd6e51aad88f6f4ce6ab8827279cfffb92266"
            to: "0xd9c500dff816a1da21a48a732d3498bf09dc9aeb"
            value: "1000000000000000000"
            data: ""
        expect_pass: false
        expect_reason: "hook not allowed"
      - name: 'reject: amountIn over the per-swap cap'
        input:
          sign_type: "transaction"
          chain_id: 56
          signer: "0xf39fd6e51aad88f6f4ce6ab8827279cfffb92266"
          transaction:
            from: "0xf39fd6e51aad88f6f4ce6ab8827279cfffb92266"
            to: "0xd9c500dff816a1da21a48a732d3498bf09dc9aeb"
            value: "1000000000000000000"
            data: ""
        expect_pass: false
        expect_reason: "amountIn exceeds cap"
      - name: 'reject: a zero output floor accepts any fill, including none'
        input:
          sign_type: "transaction"
          chain_id: 56
          signer: "0xf39fd6e51aad88f6f4ce6ab8827279cfffb92266"
          transaction:
            from: "0xf39fd6e51aad88f6f4ce6ab8827279cfffb92266"
            to: "0xd9c500dff816a1da21a48a732d3498bf09dc9aeb"
            value: "1000000000000000000"
            data: ""
        expect_pass: false
        expect_reason: "amountOutMinimum must be non-zero"
      - name: 'reject: TAKE_ALL floor zeroed on the settlement side only'
        input:
          sign_type: "transaction"
          chain_id: 56
          signer: "0xf39fd6e51aad88f6f4ce6ab8827279cfffb92266"
          transaction:
            from: "0xf39fd6e51aad88f6f4ce6ab8827279cfffb92266"
            to: "0xd9c500dff816a1da21a48a732d3498bf09dc9aeb"
            value: "1000000000000000000"
            data: ""
        expect_pass: false
        expect_reason: "TAKE_ALL floor must be non-zero"
