# staticcheck 配置。
#
# ⛔ U1000(unused)在本仓库**必须关掉**,不是因为嫌它烦,而是因为它在这里
# 系统性误报:测试里的 mock 要实现 storage.XxxRepository 整个接口(Create/Get/
# Update/Delete/List/Count/Upsert…),而单条用例只会用到其中一两个方法。
# staticcheck 看不出「这个方法是为了满足接口而存在」,于是一口气报 131 条 ——
# 占全部发现的 91%。
#
# ⚠️ 判据是「这条门禁的输出人会不会读」:131 条噪声里埋着 13 条真问题时,
# 人只会把整个 staticcheck 从 make check 里删掉(会误报的门禁最后会被
# `|| true` 掉)。关掉 U1000 之后剩下的 13 条全部是真的,值得逐条修。
#
# 真正的 unused 由编译器(未使用的局部变量/import)和 code review 兜住。
# ⚠️ 必须把 staticcheck 的**默认排除集**原样列出来。只写 `["all", "-U1000"]`
# 会把默认关着的 ST1000/ST1003/ST1020… 一并打开 —— 实测发现数从 144 涨到 152,
# 比不配还糟。`all` 是「全部」,不是「默认」。
checks = [
    "all",
    # staticcheck 默认关闭的 stylistic 检查(照抄其默认值)
    "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022", "-ST1023",
    # 本仓库额外关闭:见上方说明
    "-U1000",
]
