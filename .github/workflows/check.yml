# `make check` —— 结构与架构门禁,跑在**每一个分支的每一次 push** 上。
#
# ⛔ 为什么它不并进 ci.yml:ci.yml 是 `on: push: branches: [main, dev]`,
# 也就是说 **feature 分支的 push 不触发它**。而 2026-09-10 那个 3.8 MB 的
# 二进制,正是顺着一条 feature 分支进来的 —— 等到合进 main 才红,它已经在
# 那条分支的历史里了,而进了历史就只能靠重写全历史来清。
#
# ⛔ 为什么它必须存在:在此之前 `make check` —— 14 条已负向验证的门禁的全部 ——
# **只挂在 .githooks/pre-commit 上,而那个 hook 从来没生效过**
# (`core.hooksPath` 没人设过,也没有任何东西检查它设没设)。
# 也就是说那些门禁当时由**什么都没有**在执行,绿是因为有人手动跑,
# 不是因为有东西拦着。一道只在本地生效的门禁,等于一道可以不生效的门禁。
#
# ⚠️ 这个 job 必须**保持在秒级**(现在 ≈13s + 装 staticcheck)。慢了人会想
# 办法绕过 —— pre-commit 上一版跑 208 秒,结果是所有提交都在 `--no-verify`。
# 慢层(integration / blackbox / e2e)归 ci.yml,别往这里加。
name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # ⚠️ 门禁 ⑪ 读的是 index/工作树,不需要历史;但 fetch-depth: 0 也不贵,
          # 而浅 clone 曾让别的门禁在 CI 上和本地给出不同结论。
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
      # ⛔ 不能省:scripts/check-prereqs.sh 会断言它存在并直接失败 ——
      # 那是有意的,因为 staticcheck 没装时 `staticcheck ./...` 的绿是假绿。
      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest
      # ⛔ 同上,check-prereqs.sh 会断言它存在**并且版本相符**。
      #
      # ⚠️ 版本从 `.golangci-version` 读,不在这里写死 —— golangci-lint 的发现集
      # 随版本变,而门禁 ⑫ 是计数棘轮:CI 和本地装不同版本 = 同一棵树两个数字,
      # 于是棘轮会在一边红。那种红人会当成噪声。
      #
      # ⚠️ 用官方安装脚本(预编译二进制,几秒)而不是 `go install`:后者要从源码
      # 编译整个 golangci-lint(≈1 分钟),而这个 job 的**全部意义**是秒级。
      - name: Install golangci-lint (pinned by .golangci-version)
        run: |
          v=$(tr -d 'v \t\r\n' < .golangci-version)
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" "v${v}"
          golangci-lint --version
      # ⛔ 门禁 ⑬(scripts/check-js-lint.sh)需要 node。它不是新增门槛 ——
      # `make build` 默认就走 vite,web-unit 层也要 node。
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            pkg/js-client/package-lock.json
            web/package-lock.json
      # ⛔ 同 staticcheck / golangci-lint:check-js-lint.sh 会断言两个包的
      # node_modules 在、而且 eslint / typescript-eslint / typescript 装的版本
      # **就是 package.json 里精确钉的那个**。缺了它**直接红**,不跳过 ——
      # 跳过得到的绿是假的。
      #
      # ⛔ `make lint-deps` 依赖 `js-client` 目标,也就是它会**构建 SDK 的 dist**。
      # 别把它换成裸 `npm ci`:web 通过 `file:../pkg/js-client` 消费 SDK,没有
      # dist/index.d.ts 时 web 上的类型感知规则会**测出另一套数字**
      # (实测 no-redundant-type-constituents 0→22,而 no-base-to-string 7→6),
      # 于是同一棵树本地绿、CI 红。门禁 ①c 会直接点名这件事。
      #
      # ⚠️ 这一步是本 job 里最贵的新增(两次 npm ci + 一次 tsup;冷跑实测 23s,
      # 有 npm cache 时更快)。
      # 判据仍是「人会不会为了省这段时间绕过它」:绕不过去 —— 这是 CI,
      # 而本地那 3 秒(5.9s → 9.0s)才是人会不会绕的那部分。
      # ⛔ 门禁 ⑭(scripts/check-openapi.sh)用 `go run …/swag@v<pin>` 生成 OpenAPI
      # 文档 —— ⚠️ 那个模块**不在 go.sum 里**(故意的:swag 是构建期工具,进
      # require 段就成了 pkg/client 的传递依赖,提案 §3.2),所以 setup-go 的
      # 按 go.sum 做 key 的缓存**不包含它**,每次 CI 都要下载一次。
      #
      # 这一步只是把那次下载从门禁里挪出来、让它在日志里有名字:和上面三条一样,
      # 「这条门禁用到的外部东西」应该在 CI 文件里点得出名,而不是藏在门禁内部
      # 突然失败。⛔ 删掉它不会让 ⑭ 变绿 —— 只会让它在下载失败时才说话。
      - name: Warm the pinned swag (gate ⑭)
        run: go run "github.com/swaggo/swag/v2/cmd/swag@v$(tr -d 'v \t\r\n' < .swag-version)" --version
      - name: Install JS lint deps (gate ⑬)
        run: make lint-deps
      - name: make check
        run: make check

  # ⑮ 的漂移档 —— **独立 job**,不在上面那个秒级 job 里。
  #
  # ⛔ 为什么必须分开:oapi-codegen v2.8.0 的 go.mod 写着 `go 1.25.0`,而本仓库的
  # go.mod 是 1.24.x,于是 `go run …@v2.8.0` 会**切换 Go 工具链** —— 在一台干净的
  # runner 上那是一次 Go 发行版下载(本机热跑 2.0s;冷机约 1 分钟)。把它塞进
  # `make check` 会把那个 job 从 13s 变成一分多钟,而那个 job 的**全部意义**是秒级:
  # 慢了人就开始 `--no-verify`,而那比没有门禁更糟(pre-commit 上一版跑过 208 秒)。
  #
  # ⛔ 为什么不挪去 ci.yml:ci.yml 是 `on: push: branches: [main, dev]`,
  # feature 分支的 push 不触发它 —— 而 2026-09-10 那个 3.8 MB 二进制正是顺着
  # feature 分支进来的。这个 workflow 跑在**每个分支的每次 push** 上,
  # 独立 job 与上面那个并行,所以「覆盖面更宽」和「反馈更快」不用二选一。
  #
  # ⚠️ 2026-09-15 起两档的分工**变了**,这里按现状重写(原文说的是「make check 的
  # ⑮ 靠 GENERATED.txt 的 sha256 证明 SDK 是这份 spec 生成的,这个 job 负责逐字节
  # 比对抓手改」—— 三句现在都不成立):
  #
  #   · Go SDK 的产物**不再入库**,所以「spec 改了而 SDK 没跟上」和「有人手改了
  #     生成文件」这两个状态都**不存在了** —— 后者不是被这个 job 抓住,是没有了:
  #     文件不进版本库,没人能手改它。
  #   · `make check` 里的 ⑮ 现在**只做 TS 档**,并明确打印「Go SDK 未检查」。
  #   · **Go 档整个在这个 job 里**(SDK_REGEN=1 现生成再比对覆盖),不再只是
  #     「额外的逐字节比对」。⛔ 所以这个 job 不是锦上添花:去掉它,Go SDK 的
  #     覆盖就没有任何地方在检查了。
  sdk-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: pkg/js-client/package-lock.json
      # ⑮ 的 TS 档要 pkg/js-client 里**钉死版本**的 openapi-typescript。
      # ⛔ 不跑 `make lint-deps`(那还要装 web + 构建 dist,与这个 job 无关)。
      - name: Install js-client deps (openapi-typescript, pinned)
        run: cd pkg/js-client && npm ci --no-audit --no-fund
      # ⛔ 不能省,理由同上面那个 job 里 swag 的 warm 步骤:这个模块**不在
      # go.sum 里**(生成器是构建期工具),setup-go 按 go.sum 做 key 的缓存不含它,
      # 而且它还会带下来一次 Go 工具链切换。让那次下载在日志里有名字,
      # 而不是藏在门禁内部突然失败。
      - name: Warm the pinned oapi-codegen (gate ⑮)
        run: |
          v=$(tr -d 'v \t\r\n' < .oapi-codegen-version)
          go run "github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v${v}" -version
      - name: Regenerate the SDKs and byte-compare (gate ⑮d)
        run: SDK_REGEN=1 ./scripts/check-sdk-coverage.sh
