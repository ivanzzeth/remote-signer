# oapi-codegen 配置 —— **模型那一半**。
#
# ⛔ 别把它和 oapi-codegen.client.yaml 合并成一个。分开的唯一理由是大小:
# 一次生成出来的单文件实测 **1,050,892 字节**,而 scripts/arch/40 的 ⑪b
# 拒绝任何超过 1 MB 的已跟踪文件。合并 = 门禁当场红,而红的原因("文件太大")
# 和真正该做的事("拆成两份")之间隔着一次排查。
#
# 拆成 types(≈97 KB)+ client(≈954 KB)之后两份都在线以下。
# ⚠️ client 那一份用掉了 91% 的额度 —— 见 scripts/gen-sdk.sh 里的余量断言。
#
# ⛔ 这里**没有** `output:`。实测:配置里的 `output` **压过**命令行的 `-o`,
# 于是门禁想生成到临时目录去比对时,文件安静地落回了仓库根目录 —— 比对的那份
# 永远不存在,而生成器退出码是 0。输出路径只由 scripts/gen-sdk.sh 决定。
package: gen
generate:
  models: true
